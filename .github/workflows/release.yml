# Release on a version tag (e.g. v0.1.0): single-file binaries built and smoke-tested on a runner per
# target, the VS Code extension, the .NET packages, smoke tests of the zips and packages on each OS,
# then a GitHub release. The .NET packages are not on the GitHub release; the nuget job pushes them to
# nuget.org with Trusted Publishing (OIDC, no API key) once the NUGET_USER repository variable exists
# (docs/10-dotnet.md "Publishing (maintainers)"). workflow_dispatch runs the same pipeline without the
# publishing jobs; its zips, .vsix, SHA256SUMS and packages are left as workflow artifacts.
# tag-release.yml calls this workflow after tagging a version bump: a tag pushed with GITHUB_TOKEN
# triggers no workflow, so the `tag` input stands in for the tag push.
name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to release, already pushed
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

# One release per tag; a second run for the same tag waits instead of racing on the GitHub release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The one place that decides the ref to build and whether to publish: a workflow_call run carries the
  # caller's event (push or workflow_dispatch), so github.event_name cannot tell it from a build-only run.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ] || [ "$REF_TYPE" = tag ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  binaries:
    # One runner per target: cargo cross-compiles nothing here, so each leg builds and tests its own binary.
    # The macOS targets are in binaries-macos.
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            triple: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-musl
          - os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: windows-arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: rust-version
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install the musl toolchain
        if: contains(matrix.triple, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the binary
        env:
          # The C parser of tree-sitter must be compiled by musl-gcc, not the glibc gcc of the runner.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: pnpm build:binaries --target ${{ matrix.target }}

      - name: Smoke-test the binary
        shell: bash
        run: scripts/smoke-binary.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/bin/xxmi-${{ matrix.target }}*
          if-no-files-found: error

  # Both darwin targets on one arm64 runner: macOS minutes cost the most, and Apple's SDK cross-compiles
  # x86_64 from arm64.
  binaries-macos:
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: rust-version
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build both binaries
        run: pnpm build:binaries --target macos-x64,macos-arm64

      - name: Smoke-test the arm64 binary
        run: scripts/smoke-binary.sh macos-arm64

      # Rosetta is not guaranteed on the runner: without it the x64 binary is built but not run here.
      - name: Smoke-test the x64 binary under Rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            scripts/smoke-binary.sh macos-x64
          else
            echo "::warning::Rosetta is not available; the macos-x64 binary was not smoke-tested"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binary-macos-arm64
          path: dist/bin/xxmi-macos-arm64
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: binary-macos-x64
          path: dist/bin/xxmi-macos-x64
          if-no-files-found: error

  build:
    needs: [meta, binaries, binaries-macos]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: echo "version=$(node scripts/check-version.ts)" >> "$GITHUB_OUTPUT"

      - name: Tag matches the code's version
        if: needs.meta.outputs.publish == 'true'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: test "v$VERSION" = "$TAG" || { echo "Tag $TAG but rust/Cargo.toml says $VERSION"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/bin
          merge-multiple: true

      # Artifacts do not keep the execute bit.
      - run: chmod +x dist/bin/xxmi-*

      - run: pnpm --filter ./packages/vscode run package

      # docs/10-dotnet.md: XxmiLang.Core, XxmiLang.Native.<rid> for the six targets, XxmiLang.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: node scripts/pack-dotnet.ts --out dist/nupkg

      # One zip per platform (xxmi, xxmi-lsp, LICENSE, README.txt), the .vsix and SHA256SUMS.
      - name: Bundle the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/bundle-release.ts --version "$VERSION" --vsix packages/vscode/dist/xxmi-lang.vsix --out dist/release

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

      # Not part of the GitHub release: the nuget job pushes these to nuget.org.
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            dist/nupkg/*.nupkg
            dist/nupkg/*.snupkg
          if-no-files-found: error

  smoke:
    needs: [meta, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Run the binaries from the downloaded zip
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          if command -v sha256sum > /dev/null; then sha256sum -c --ignore-missing SHA256SUMS; else shasum -a 256 -c --ignore-missing SHA256SUMS; fi
          cd ..
          mkdir unzipped
          unzip -q "release/xxmi-$VERSION-$SUFFIX.zip" -d unzipped
          ls -l unzipped
          exe=""
          case "$SUFFIX" in windows-*) exe=".exe" ;; esac
          xxmi="$PWD/unzipped/xxmi$exe"
          lsp="$PWD/unzipped/xxmi-lsp$exe"
          test -x "$xxmi" && test -x "$lsp"
          test -f unzipped/LICENSE && test -f unzipped/README.txt
          "$xxmi" --version
          "$lsp" --version
          "$xxmi" lint fixtures/rules/XM201/good.ini
          # Relative paths: Node on Windows can't spawn the MSYS-style /d/a/... path of $PWD.
          XXMI_LSP_COMMAND="[\"unzipped/xxmi-lsp$exe\",\"--stdio\"]" pnpm test:lsp
          XXMI_LSP_COMMAND="[\"unzipped/xxmi$exe\",\"lsp\",\"--stdio\"]" pnpm test:lsp

      # Install the packages built above in a fresh app, with no XXMI_PATH (docs/10-dotnet.md).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: The NuGet packages work from a local feed
        run: node scripts/smoke-dotnet.ts --feed nupkg

  publish:
    needs: [meta, smoke]
    # A build-only workflow_dispatch stops before this job: the release and nupkg artifacts are its output.
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          files=(xxmi-*.zip xxmi-lang-*.vsix SHA256SUMS)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes "${files[@]}"
          fi

      # Appended after the generated notes; a re-run that already has the table leaves the body alone.
      - name: Add the checksums to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          body=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          if [[ "$body" != *'## Checksums'* ]]; then
            cd release
            table=$(../.github/scripts/release_checksums.sh . xxmi-*.zip xxmi-lang-*.vsix)
            printf '%s\n\n%s\n' "$body" "$table" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # Its own job so a failed push can be re-run without touching the GitHub release.
  nuget:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing: the OIDC token NuGet/login exchanges for a short-lived key
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      # Without the NUGET_USER variable nothing is pushed (docs/10-dotnet.md "Publishing (maintainers)").
      - name: Check the nuget.org user
        id: user
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::warning::NUGET_USER repository variable not set; skipping nuget.org push (see docs/10-dotnet.md)"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: NuGet/login@v1
        if: steps.user.outputs.set == 'true'
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # XxmiLang.Core, the runtime packages and XxmiLang first, in that order.
      - name: Push the packages to nuget.org
        if: steps.user.outputs.set == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          cd nupkg
          for f in XxmiLang.Core.[0-9]*.nupkg XxmiLang.Native.*.nupkg XxmiLang.[0-9]*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  # Mirrors the packages to GitHub Packages so they show in the repo sidebar. Independent of the
  # nuget job: neither blocks the other.
  github-packages:
    needs: publish
    permissions:
      packages: write
      contents: read
      actions: read
    uses: ./.github/workflows/github-packages.yml
