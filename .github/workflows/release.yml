# Release on a version tag (e.g. v0.1.0): single-file binaries for every target (one zip per
# platform), the VS Code extension, the .NET packages, smoke tests of the built zips and packages
# on each OS, then a GitHub release. The .NET packages are not on the GitHub release; the nuget job
# pushes them to nuget.org with Trusted Publishing (OIDC, no API key) once the NUGET_USER
# repository variable exists (docs/10-dotnet.md "Publishing (maintainers)").
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the code's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node --conditions=source --input-type=module -e "import { VERSION } from './packages/core/src/version.ts'; console.log(VERSION)")
          test "v$version" = "$TAG" || { echo "Tag $TAG but packages/core/src/version.ts says $version"; exit 1; }

      - run: pnpm build

      # Bun cross-compiles, so one runner builds every target.
      - run: pnpm build:binaries

      - run: pnpm --filter ./packages/vscode run package

      # docs/10-dotnet.md: XxmiLang.Core, XxmiLang.Native.<rid> for the six targets, XxmiLang, XxmiLang.All.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: node scripts/pack-dotnet.ts --out dist/nupkg

      # One zip per platform (xxmi, xxmi-lsp, LICENSE, README.txt), the .vsix and SHA256SUMS.
      - name: Bundle the release files
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/bundle-release.ts --version "${TAG#v}" --vsix packages/vscode/dist/xxmi-lang.vsix --out dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

      # Not part of the GitHub release: the nuget job pushes these to nuget.org.
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/nupkg/*.nupkg
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Run the binaries from the downloaded zip
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cd release
          if command -v sha256sum > /dev/null; then sha256sum -c --ignore-missing SHA256SUMS; else shasum -a 256 -c --ignore-missing SHA256SUMS; fi
          cd ..
          mkdir unzipped
          unzip -q "release/xxmi-${GITHUB_REF_NAME#v}-$SUFFIX.zip" -d unzipped
          ls -l unzipped
          exe=""
          case "$SUFFIX" in windows-*) exe=".exe" ;; esac
          xxmi="$PWD/unzipped/xxmi$exe"
          lsp="$PWD/unzipped/xxmi-lsp$exe"
          test -x "$xxmi" && test -x "$lsp"
          test -f unzipped/LICENSE && test -f unzipped/README.txt
          "$xxmi" --version
          "$lsp" --version
          "$xxmi" lint fixtures/rules/XM201/good.ini
          # Relative paths: Node on Windows can't spawn the MSYS-style /d/a/... path of $PWD.
          XXMI_LSP_COMMAND="[\"unzipped/xxmi-lsp$exe\",\"--stdio\"]" pnpm vitest run packages/lsp
          XXMI_LSP_COMMAND="[\"unzipped/xxmi$exe\",\"lsp\",\"--stdio\"]" pnpm vitest run packages/lsp

      # Install the packages built above in a fresh app, with no XXMI_PATH (docs/10-dotnet.md).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The NuGet packages work from a local feed
        run: node scripts/smoke-dotnet.ts --feed nupkg

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          files=(xxmi-*.zip xxmi-lang-*.vsix SHA256SUMS)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes "${files[@]}"
          fi

  # Its own job so a failed push can be re-run without touching the GitHub release.
  nuget:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing: the OIDC token NuGet/login exchanges for a short-lived key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      # Without the NUGET_USER variable nothing is pushed (docs/10-dotnet.md "Publishing (maintainers)").
      - name: Check the nuget.org user
        id: user
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::warning::NUGET_USER repository variable not set; skipping nuget.org push (see docs/10-dotnet.md)"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: NuGet/login@v1
        if: steps.user.outputs.set == 'true'
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # XxmiLang.Core, the runtime packages and XxmiLang first, in that order, the XxmiLang.All meta package last.
      - name: Push the packages to nuget.org
        if: steps.user.outputs.set == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          cd nupkg
          for f in XxmiLang.Core.[0-9]*.nupkg XxmiLang.Native.*.nupkg XxmiLang.[0-9]*.nupkg XxmiLang.All.*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
