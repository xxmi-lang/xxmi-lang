# Release on a version tag (e.g. v0.1.0): single-file binaries for every target, the VS Code
# extension, smoke tests of the built binaries on each OS, then a GitHub release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the code's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node --conditions=source --input-type=module -e "import { VERSION } from './packages/core/src/version.ts'; console.log(VERSION)")
          test "v$version" = "$TAG" || { echo "Tag $TAG but packages/core/src/version.ts says $version"; exit 1; }

      - run: pnpm build

      # Bun cross-compiles, so one runner builds every target.
      - run: pnpm build:binaries

      - run: pnpm --filter ./packages/vscode run package

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/bin/*
            packages/vscode/dist/xxmi-lang.vsix

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64.exe
          - os: macos-latest
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Run the downloaded binaries
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          chmod +x release/dist/bin/* || true
          "release/dist/bin/xxmi-$SUFFIX" --version
          "release/dist/bin/xxmi-$SUFFIX" lint fixtures/rules/XM201/good.ini
          XXMI_LSP_COMMAND="[\"release/dist/bin/xxmi-lsp-$SUFFIX\",\"--stdio\"]" pnpm vitest run packages/lsp

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          files=(dist/bin/* packages/vscode/dist/xxmi-lang.vsix)
          sha256sum "${files[@]}" | sed 's#  .*/#  #' > SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes "${files[@]}" SHA256SUMS
