# Release on a version tag (e.g. v0.1.0): single-file binaries built and smoke-tested on a runner per
# target, the VS Code extension, the .NET packages, smoke tests of the zips and packages on each OS,
# then a GitHub release. The .NET packages are not on the GitHub release; the nuget job pushes them to
# nuget.org with Trusted Publishing (OIDC, no API key) once the NUGET_USER repository variable exists
# (docs/10-dotnet.md "Publishing (maintainers)"). workflow_dispatch runs the same pipeline without the
# publishing jobs; its zips, .vsix, SHA256SUMS and packages are left as workflow artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    # One runner per target: cargo cross-compiles nothing here, so each leg builds and tests its own binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            triple: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: macos-x64
            triple: x86_64-apple-darwin
          - os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
          - os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: windows-arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The rust/ build embeds packages/core/dist/spec.json.
      - run: pnpm build

      - id: rust-version
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install the musl toolchain
        if: contains(matrix.triple, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the binary
        env:
          # The C parser of tree-sitter must be compiled by musl-gcc, not the glibc gcc of the runner.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: pnpm build:binaries --target ${{ matrix.target }}

      - name: Smoke-test the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          bin="dist/bin/xxmi-$TARGET$exe"
          "$bin" --version
          "$bin" lint fixtures/rules/XM201/good.ini
          # The language server is chosen by the program's file name, so test it under that name too.
          mkdir smoke
          cp "$bin" "smoke/xxmi-lsp$exe"
          node rust/bench/lsp-smoke.mjs "smoke/xxmi-lsp$exe"
          node rust/bench/lsp-smoke.mjs "$bin" lsp

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/bin/xxmi-${{ matrix.target }}*
          if-no-files-found: error

  build:
    needs: binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: echo "version=$(node --conditions=source --input-type=module -e "import { VERSION } from './packages/core/src/version.ts'; console.log(VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Tag matches the code's version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: test "v$VERSION" = "$TAG" || { echo "Tag $TAG but packages/core/src/version.ts says $VERSION"; exit 1; }

      - run: pnpm build

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/bin
          merge-multiple: true

      # Artifacts do not keep the execute bit.
      - run: chmod +x dist/bin/xxmi-*

      - run: pnpm --filter ./packages/vscode run package

      # docs/10-dotnet.md: XxmiLang.Core, XxmiLang.Native.<rid> for the six targets, XxmiLang.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: node scripts/pack-dotnet.ts --out dist/nupkg

      # One zip per platform (xxmi, xxmi-lsp, LICENSE, README.txt), the .vsix and SHA256SUMS.
      - name: Bundle the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/bundle-release.ts --version "$VERSION" --vsix packages/vscode/dist/xxmi-lang.vsix --out dist/release

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

      # Not part of the GitHub release: the nuget job pushes these to nuget.org.
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            dist/nupkg/*.nupkg
            dist/nupkg/*.snupkg
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Run the binaries from the downloaded zip
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          if command -v sha256sum > /dev/null; then sha256sum -c --ignore-missing SHA256SUMS; else shasum -a 256 -c --ignore-missing SHA256SUMS; fi
          cd ..
          mkdir unzipped
          unzip -q "release/xxmi-$VERSION-$SUFFIX.zip" -d unzipped
          ls -l unzipped
          exe=""
          case "$SUFFIX" in windows-*) exe=".exe" ;; esac
          xxmi="$PWD/unzipped/xxmi$exe"
          lsp="$PWD/unzipped/xxmi-lsp$exe"
          test -x "$xxmi" && test -x "$lsp"
          test -f unzipped/LICENSE && test -f unzipped/README.txt
          "$xxmi" --version
          "$lsp" --version
          "$xxmi" lint fixtures/rules/XM201/good.ini
          # Relative paths: Node on Windows can't spawn the MSYS-style /d/a/... path of $PWD.
          XXMI_LSP_COMMAND="[\"unzipped/xxmi-lsp$exe\",\"--stdio\"]" pnpm vitest run packages/lsp
          XXMI_LSP_COMMAND="[\"unzipped/xxmi$exe\",\"lsp\",\"--stdio\"]" pnpm vitest run packages/lsp

      # Install the packages built above in a fresh app, with no XXMI_PATH (docs/10-dotnet.md).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: The NuGet packages work from a local feed
        run: node scripts/smoke-dotnet.ts --feed nupkg

  publish:
    needs: smoke
    # workflow_dispatch stops before this job: the release and nupkg artifacts are its output.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          files=(xxmi-*.zip xxmi-lang-*.vsix SHA256SUMS)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes "${files[@]}"
          fi

  # Its own job so a failed push can be re-run without touching the GitHub release.
  nuget:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing: the OIDC token NuGet/login exchanges for a short-lived key
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      # Without the NUGET_USER variable nothing is pushed (docs/10-dotnet.md "Publishing (maintainers)").
      - name: Check the nuget.org user
        id: user
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::warning::NUGET_USER repository variable not set; skipping nuget.org push (see docs/10-dotnet.md)"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: NuGet/login@v1
        if: steps.user.outputs.set == 'true'
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # XxmiLang.Core, the runtime packages and XxmiLang first, in that order.
      - name: Push the packages to nuget.org
        if: steps.user.outputs.set == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          cd nupkg
          for f in XxmiLang.Core.[0-9]*.nupkg XxmiLang.Native.*.nupkg XxmiLang.[0-9]*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  # Mirrors the packages to GitHub Packages so they show in the repo sidebar. Independent of the
  # nuget job: neither blocks the other.
  github-packages:
    needs: publish
    permissions:
      packages: write
      contents: read
      actions: read
    uses: ./.github/workflows/github-packages.yml
