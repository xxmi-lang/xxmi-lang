# Release on a version tag (e.g. v0.1.0): single-file binaries for every target, the VS Code
# extension, the .NET packages, smoke tests of the built binaries and packages on each OS, then a
# GitHub release. The packages go to nuget.org only if the NUGET_API_KEY secret exists.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the code's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node --conditions=source --input-type=module -e "import { VERSION } from './packages/core/src/version.ts'; console.log(VERSION)")
          test "v$version" = "$TAG" || { echo "Tag $TAG but packages/core/src/version.ts says $version"; exit 1; }

      - run: pnpm build

      # Bun cross-compiles, so one runner builds every target.
      - run: pnpm build:binaries

      - run: pnpm --filter ./packages/vscode run package

      # docs/10-dotnet.md: XxmiLang.Core, XxmiLang.Native.<rid> for the six targets, XxmiLang, XxmiLang.All.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: node scripts/pack-dotnet.ts --out dist/nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/bin/*
            dist/nupkg/*.nupkg
            packages/vscode/dist/xxmi-lang.vsix

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64.exe
          - os: macos-latest
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Run the downloaded binaries
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          chmod +x release/dist/bin/* || true
          "release/dist/bin/xxmi-$SUFFIX" --version
          "release/dist/bin/xxmi-$SUFFIX" lint fixtures/rules/XM201/good.ini
          XXMI_LSP_COMMAND="[\"release/dist/bin/xxmi-lsp-$SUFFIX\",\"--stdio\"]" pnpm vitest run packages/lsp
          XXMI_LSP_COMMAND="[\"release/dist/bin/xxmi-$SUFFIX\",\"lsp\",\"--stdio\"]" pnpm vitest run packages/lsp

      # Install the packages built above in a fresh app, with no XXMI_PATH (docs/10-dotnet.md).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The NuGet packages work from a local feed
        run: node scripts/smoke-dotnet.ts --feed release/dist/nupkg

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          files=(dist/bin/* dist/nupkg/*.nupkg packages/vscode/dist/xxmi-lang.vsix)
          sha256sum "${files[@]}" | sed 's#  .*/#  #' > SHA256SUMS
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}" SHA256SUMS
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes "${files[@]}" SHA256SUMS
          fi

  # Its own job so a failed push can be re-run without touching the GitHub release.
  nuget:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      # XxmiLang.Core, the runtime packages and XxmiLang first, in that order, the XxmiLang.All meta package last.
      # Without the NUGET_API_KEY secret the packages are only attached to the GitHub release.
      - name: Push the packages to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY not set, skipping nuget.org push"
            exit 0
          fi
          cd release/dist/nupkg
          for f in XxmiLang.Core.[0-9]*.nupkg XxmiLang.Native.*.nupkg XxmiLang.[0-9]*.nupkg XxmiLang.All.*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
