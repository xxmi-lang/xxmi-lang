# Daily: re-extract spec/generated/ from the latest XXMI DLL source and open a PR when it changes.
name: spec-extract

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: spec-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check out XXMI-Libs-Package master
        uses: actions/checkout@v4
        with:
          repository: SpectrumQT/XXMI-Libs-Package
          ref: master
          path: .dll/xxmi
          persist-credentials: false
          # Keep in sync with DllSource.load (packages/spec-extractor/src/dll.ts).
          sparse-checkout: |
            /DirectX11/
            /D3DCompiler/
            /Injector/
            /util.h
          sparse-checkout-cone-mode: false

      - name: Check out 3Dmigoto master
        uses: actions/checkout@v4
        with:
          repository: bo3b/3Dmigoto
          ref: master
          path: .dll/vanilla
          persist-credentials: false
          # Keep in sync with DllSource.load (packages/spec-extractor/src/dll.ts).
          sparse-checkout: |
            /DirectX11/
            /D3DCompiler/
            /Injector/
            /util.h
          sparse-checkout-cone-mode: false

      # Fails (exit 3) when the DLL moved a table or parser the extractor anchors on.
      - name: Extract
        run: pnpm spec:extract
        env:
          XXMI_DLL_SRC: .dll/xxmi
          MIGOTO_DLL_SRC: .dll/vanilla

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- spec/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- spec/generated
          fi

      # Overlays that point at entries the DLL removed make this fail; the PR says so.
      - name: Test against the new spec
        id: test
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm test
        env:
          XXMI_DLL_SRC: .dll/xxmi
          MIGOTO_DLL_SRC: .dll/vanilla

      - name: Open PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          commit=$(node -p "require('./spec/generated/meta.json').dll.commit")
          branch="spec/update-${commit:0:12}"
          export BRANCH="$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # meta.json has no run-specific fields, so identical content means nothing new to push.
          pushed=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null \
            && git fetch --depth 1 origin "$branch" \
            && git diff --quiet FETCH_HEAD -- spec/generated; then
            echo "spec branch already up to date"
          else
            git checkout -b "$branch"
            git add spec/generated
            git commit -m "spec: regenerate from XXMI-Libs-Package ${commit:0:12}"
            git push --force origin "$branch"
            pushed=true
          fi

          body="Regenerated \`spec/generated/\` from SpectrumQT/XXMI-Libs-Package@${commit}.

          Tests against the new spec: **${TEST_OUTCOME}**. Review the diff for removed or renamed entries; overlays in \`spec/overlay/\` that point at removed entries make the tests fail."
          created=false
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" -eq 0 ]; then
            gh pr create --base main --head "$branch" --title "spec: regenerate from XXMI-Libs-Package ${commit:0:12}" --body "$body"
            created=true
          else
            echo "PR already open for $branch"
          fi

          if [ "$pushed" = true ] || [ "$created" = true ]; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

          current=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          gh pr list --author "app/github-actions" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("spec/update-")) | select(.headRefName != env.BRANCH) | .number' \
            | while read -r old; do
                gh pr close "$old" --delete-branch --comment "Superseded by #${current}."
              done

      # github.token events do not start workflows, so dispatch CI on the PR branch explicitly.
      - name: Run CI on the spec branch
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
