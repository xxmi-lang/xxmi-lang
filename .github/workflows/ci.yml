name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: parse the latest ZZMI-Package, not just the pinned commit.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      # macOS runners are opt-in: hosted macOS queues have stalled whole runs.
      macos:
        description: Also run the macOS legs
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned so PR CI doesn't break when the package changes; the weekly run uses main. Must match
  # the commit in snapshots/zzmi.json (rebuild it with `pnpm xxmi index`).
  ZZMI_PACKAGE_REF: 1ecd24dbc85f96239eaadeb7c4e0788aef7fae4f

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: rust-version
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Every manifest has the version of rust/Cargo.toml
        run: pnpm check:version

      - run: pnpm lint

      - run: pnpm typecheck

      # The DLL sources spec/generated/ was extracted from (commits recorded in meta.json).
      - name: Read spec source commits
        id: spec
        shell: bash
        run: |
          echo "dll=$(node -p "require('./spec/generated/meta.json').dll.commit")" >> "$GITHUB_OUTPUT"
          echo "baseline=$(node -p "require('./spec/generated/meta.json').baseline.commit")" >> "$GITHUB_OUTPUT"

      - name: Check out XXMI-Libs-Package (DLL source)
        uses: actions/checkout@v7
        with:
          repository: SpectrumQT/XXMI-Libs-Package
          ref: ${{ steps.spec.outputs.dll }}
          path: .dll/xxmi
          persist-credentials: false
          # Keep in sync with DllSource::load (rust/crates/xxmi-spec-extractor/src/dll.rs).
          sparse-checkout: |
            /DirectX11/
            /D3DCompiler/
            /Injector/
            /util.h
          sparse-checkout-cone-mode: false

      # The checkout is one commit without tags; spec-build-tags.test.ts needs these.
      - name: Fetch DLL release tags
        shell: bash
        run: |
          git -C .dll/xxmi fetch --depth=1 --no-tags origin \
              refs/tags/v1.2.0:refs/tags/v1.2.0 \
              refs/tags/v1.2.1:refs/tags/v1.2.1 \
              refs/tags/v1.2.2:refs/tags/v1.2.2 \
              refs/tags/v1.2.3:refs/tags/v1.2.3 \
              refs/tags/v1.3.0:refs/tags/v1.3.0 \
              refs/tags/v1.3.1:refs/tags/v1.3.1 \
              refs/tags/v1.3.2:refs/tags/v1.3.2 \
              refs/tags/v1.3.3:refs/tags/v1.3.3

      - name: Check out 3Dmigoto (vanilla baseline)
        uses: actions/checkout@v7
        with:
          repository: bo3b/3Dmigoto
          ref: ${{ steps.spec.outputs.baseline }}
          path: .dll/vanilla
          persist-credentials: false
          # Keep in sync with DllSource::load (rust/crates/xxmi-spec-extractor/src/dll.rs).
          sparse-checkout: |
            /DirectX11/
            /D3DCompiler/
            /Injector/
            /util.h
          sparse-checkout-cone-mode: false

      - run: pnpm test
        env:
          XXMI_DLL_SRC: .dll/xxmi
          MIGOTO_DLL_SRC: .dll/vanilla

      - name: spec/generated matches its DLL commit
        run: pnpm spec:extract --check
        env:
          XXMI_DLL_SRC: .dll/xxmi
          MIGOTO_DLL_SRC: .dll/vanilla

      - name: Check out ZZMI-Package
        uses: actions/checkout@v7
        with:
          repository: leotorrez/ZZMI-Package
          ref: ${{ github.event_name == 'schedule' && 'main' || env.ZZMI_PACKAGE_REF }}
          path: .zzmi-package
          persist-credentials: false

      # --strict: every .ini must parse without ERROR/MISSING nodes, and linting the package
      # itself must report no errors (docs/09-roadmap.md M2).
      - name: Parse and lint ZZMI-Package
        run: pnpm test:corpus --strict
        env:
          XXMI_PACKAGE_SRC: .zzmi-package

      - name: Bundled ZZMI snapshot matches the pinned package
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          pnpm xxmi index .zzmi-package/ZZMI --out "$RUNNER_TEMP/zzmi.json" --name zzmi
          diff snapshots/zzmi.json "$RUNNER_TEMP/zzmi.json"

      # docs/09-roadmap.md M3: test the compiled binaries, not just the Node build.
      - name: Build single-file binaries for this machine
        run: pnpm build:binaries --target host

      - name: Protocol tests against the compiled xxmi-lsp and xxmi lsp
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          XXMI_LSP_COMMAND="[\"dist/bin/xxmi-lsp$exe\",\"--stdio\"]" pnpm test:lsp
          XXMI_LSP_COMMAND="[\"dist/bin/xxmi$exe\",\"lsp\",\"--stdio\"]" pnpm test:lsp
          "dist/bin/xxmi$exe" --version
          "dist/bin/xxmi$exe" lint fixtures/rules/XM201/good.ini

  rust:
    # The Rust binary (docs/rust-port.md): format, clippy and the test suites on each OS.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - id: rust-version
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The MCP server shells out to rg; its tests need it on PATH.
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path rust/Cargo.toml --release -- -D warnings

      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml --release --no-fail-fast

  dotnet:
    # The .NET library (docs/10-dotnet.md) driving the compiled `xxmi` of this machine.
    # A hung test once ran this job for 6 hours: the limits below end it in minutes and name the test.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      XXMI_PATH: ${{ github.workspace }}/dist/bin/xxmi${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - id: rust-version
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: pnpm build:binaries --target host

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test against XXMI_PATH
        run: dotnet test dotnet/XxmiLang.slnx --configuration Release --blame-hang --blame-hang-timeout 3m --results-directory dotnet/TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results-${{ matrix.os }}
          path: dotnet/TestResults

      - name: Library builds clean (warnings are errors, incl. trim and AOT analyzers)
        run: dotnet build dotnet/XxmiLang.slnx --configuration Release -warnaserror

      # Native AOT: the sample publishes with no trim/AOT warning (TreatWarningsAsErrors) and the native
      # executable works against the compiled xxmi.
      - name: Native AOT publish of the sample
        shell: bash
        run: |
          rid=$(dotnet --info | sed -n 's/^ *RID: *//p' | head -1)
          dotnet publish dotnet/samples/XxmiLang.Sample -c Release -r "$rid" -p:PublishAot=true -o "$RUNNER_TEMP/aot"
          exe="$RUNNER_TEMP/aot/XxmiLang.Sample"
          [ "${{ matrix.os }}" = windows-latest ] && exe="$exe.exe"
          "$exe" lint fixtures/rules/XM201/good.ini
          # bad.ini has errors, so the exit code is 1 (findings); only the output is checked.
          out=$("$exe" text fixtures/rules/XM201/bad.ini || true)
          echo "$out"
          echo "$out" | grep -q XM201
          out=$("$exe" hover fixtures/rules/XM201/good.ini 1 3)
          echo "$out"
          echo "$out" | grep -q TextureOverride

      # Packs this machine's runtime package and installs it in a fresh app (the script drops XXMI_PATH).
      - name: Packages work from a local feed
        shell: bash
        run: |
          node scripts/pack-dotnet.ts --host --out "$RUNNER_TEMP/nupkg"
          node scripts/smoke-dotnet.ts --feed "$RUNNER_TEMP/nupkg"

  vscode:
    # A real VS Code (downloaded by @vscode/test-electron) with the bundled extension.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - id: rust-version
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: pnpm build:binaries --target host

      - run: xvfb-run -a pnpm --filter ./packages/vscode test:vscode

      - run: pnpm --filter ./packages/vscode run package

      - uses: actions/upload-artifact@v7
        with:
          name: xxmi-lang-vsix
          path: packages/vscode/dist/xxmi-lang.vsix

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: |
          claude plugin validate ./plugin
          claude plugin validate .

  docker-rust:
    # The hosted MCP server image (docs/06-mcp-server.md). Built, not pushed: Railway builds it
    # from the repo on deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the image
        run: docker build -f docker/mcp/Dockerfile -t xxmi-mcp-rs .

      - name: Container starts, passes its health check and lists the tools
        run: |
          docker run -d --name mcp -p 3000:3000 -v mcp-data:/data -e INDEXER=off xxmi-mcp-rs
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q lint_ini
          # The server process itself runs unprivileged.
          docker exec mcp sh -c 'for p in /proc/[0-9]*; do [ "$(cat $p/comm 2>/dev/null)" = xxmi-mcp ] && stat -c %U $p; done' | grep -qx node

      # The M6 acceptance questions need the indexer, so this container runs without INDEXER=off.
      # Its own name, volume and port keep it apart from the container above.
      - name: Acceptance questions against the running container
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # Runner IPs share GitHub's unauthenticated API limit; the indexer reads it from the env.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run -d --name mcp-acceptance -p 3001:3000 -v mcp-acceptance-data:/data -e GITHUB_TOKEN xxmi-mcp-rs
          node scripts/mcp-acceptance.ts http://localhost:3001/mcp

      - if: always()
        run: docker logs mcp

      - if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: docker logs mcp-acceptance
