name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: parse the latest ZZMI-Package, not just the pinned commit.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so PR CI doesn't break when the package changes; the weekly run uses main. Must match
  # the commit in packages/core/snapshots/zzmi.json (rebuild it with `pnpm xxmi index`).
  ZZMI_PACKAGE_REF: 1ecd24dbc85f96239eaadeb7c4e0788aef7fae4f

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      # The DLL sources spec/generated/ was extracted from (commits recorded in meta.json).
      - name: Read spec source commits
        id: spec
        shell: bash
        run: |
          echo "dll=$(node -p "require('./spec/generated/meta.json').dll.commit")" >> "$GITHUB_OUTPUT"
          echo "baseline=$(node -p "require('./spec/generated/meta.json').baseline.commit")" >> "$GITHUB_OUTPUT"

      - name: Check out XXMI-Libs-Package (DLL source)
        uses: actions/checkout@v4
        with:
          repository: SpectrumQT/XXMI-Libs-Package
          ref: ${{ steps.spec.outputs.dll }}
          path: .dll/xxmi
          persist-credentials: false
          # Keep in sync with DllSource.load (packages/spec-extractor/src/dll.ts).
          sparse-checkout: |
            /DirectX11/
            /D3DCompiler/
            /Injector/
            /util.h
          sparse-checkout-cone-mode: false

      - name: Check out 3Dmigoto (vanilla baseline)
        uses: actions/checkout@v4
        with:
          repository: bo3b/3Dmigoto
          ref: ${{ steps.spec.outputs.baseline }}
          path: .dll/vanilla
          persist-credentials: false
          # Keep in sync with DllSource.load (packages/spec-extractor/src/dll.ts).
          sparse-checkout: |
            /DirectX11/
            /D3DCompiler/
            /Injector/
            /util.h
          sparse-checkout-cone-mode: false

      - run: pnpm test
        env:
          XXMI_DLL_SRC: .dll/xxmi
          MIGOTO_DLL_SRC: .dll/vanilla

      - name: spec/generated matches its DLL commit
        run: pnpm spec:extract --check
        env:
          XXMI_DLL_SRC: .dll/xxmi
          MIGOTO_DLL_SRC: .dll/vanilla

      - name: Check out ZZMI-Package
        uses: actions/checkout@v4
        with:
          repository: leotorrez/ZZMI-Package
          ref: ${{ github.event_name == 'schedule' && 'main' || env.ZZMI_PACKAGE_REF }}
          path: .zzmi-package
          persist-credentials: false

      # --strict: every .ini must parse without ERROR/MISSING nodes, and linting the package
      # itself must report no errors (docs/09-roadmap.md M2).
      - name: Parse and lint ZZMI-Package
        run: pnpm test:corpus --strict
        env:
          XXMI_PACKAGE_SRC: .zzmi-package

      - name: Bundled ZZMI snapshot matches the pinned package
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          pnpm xxmi index .zzmi-package/ZZMI --out "$RUNNER_TEMP/zzmi.json" --name zzmi
          diff packages/core/snapshots/zzmi.json "$RUNNER_TEMP/zzmi.json"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # docs/09-roadmap.md M3: test the compiled binaries, not just the Node build.
      - name: Build single-file binaries for this machine
        run: pnpm build:binaries --target host

      - name: Protocol tests against the compiled xxmi-lsp and the bundled VS Code server
        shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          XXMI_LSP_COMMAND="[\"dist/bin/xxmi-lsp$exe\",\"--stdio\"]" pnpm vitest run packages/lsp
          XXMI_LSP_COMMAND="[\"node\",\"--liftoff-only\",\"packages/vscode/dist/server.mjs\",\"--stdio\"]" pnpm vitest run packages/lsp
          "dist/bin/xxmi$exe" --version
          "dist/bin/xxmi$exe" lint fixtures/rules/XM201/good.ini

  vscode:
    # A real VS Code (downloaded by @vscode/test-electron) with the bundled extension.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: xvfb-run -a pnpm --filter ./packages/vscode test:vscode

      - run: pnpm --filter ./packages/vscode run package

      - uses: actions/upload-artifact@v4
        with:
          name: xxmi-lang-vsix
          path: packages/vscode/dist/xxmi-lang.vsix

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: |
          claude plugin validate ./plugin
          claude plugin validate .
