[ResourceBody]
type = Buffer
stride = 4

[KeySwap]
key = VK_F1
type = cycle
$swap = 0, 1
x = 1

[CommandListA]
run = CommandListB
ps-t0 = ResourceBody

[CommandListB]

[Profile]
StereoProfile = 1

[FilterMatch]
match_format = R8G8B8A8_UNORM
match_dhash = 0123456789abcdef
match_confidence = 0.9

[Rendering]
dhash_mip_size = 8
dhash_allow_rehash = 1

[Hunting]
dump_mips = 1
