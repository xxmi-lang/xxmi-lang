; What the GIMI DLL (v0.1.0) reads.
[Constants]
global $plain = 1
global persist $kept = 0

[ResourceTex]
type = Texture2D
format = R8G8B8A8_UNORM

[TextureOverrideBody]
hash = 12345678
override_byte_stride = 16
filter_index = 3.0
match_first_index = 6
store = $plain, ResourceTex, 7
local $count = 1
if $plain == 1 && $kept != 2
  $count = $count + 1 * 2
elif !($plain < 1)
  $count = -$count
else
  $count = 0
endif
run = CommandListHelper
ps-t0 = ResourceTex

[CommandListHelper]
$plain = 2

[Logging]
calls = 1
