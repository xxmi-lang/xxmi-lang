; Each construct below is stamped gimi: false in the spec.
[Constants]
global locked $locked = 1
global persist $kept = 0

[PoolSlots]
pool_size = 4
pool_index_type = ring

[FilterSlots]
match_format = R8_UNORM

[Input]
toggle_input = no_modifiers VK_F5

[ResourceTex]
type = Texture2D
color_space = sRGB

[TextureOverrideBody]
hash = 12345678
uav_byte_stride = 16
ResourceTex = copy ResourceTex
local $w = ResourceTex->width
$a = $kept & 3
$a = $kept << 1
$a = ~$kept
$a = abs($kept) + countbits(3)
x = frame_number
if fps > 30
  $a = 1
endif
run = SnapshotInitialTextures
local $p = PoolSlots[0]->Size

[Logging]
log_level = 2

[System]
dll_initialization_delay = 5

[Hunting]
dump_mips = 1
