; `store` reads a value from a resource into a variable. The resource name must end at the comma.
[ResourceCounters]
type = RWBuffer
format = R32_UINT
array = 16

[CommandListReadCounters]
store = $packed, ResourceCounters, 7
store = $flags, Resource.Counters.UAV, 15
$low = $packed & 127
$high = ($packed >> 7) & 127
