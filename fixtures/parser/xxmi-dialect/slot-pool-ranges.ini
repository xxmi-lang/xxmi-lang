; Slots given by an expression, and slot/pool ranges (ResourceCopyTarget::ParseTargetSlotExpression,
; ParseTargetPool and ParseRangeBounds in XXMI-Libs-Package DirectX11/CommandList.cpp).
[ResourceTex]

[PoolSlots]
pool_size = 4

[CommandListRanges]
local $first = 0
local $last = 2
ps-t[0:2] = null
vs-cb[$first:$last] = null
cs-u[$first] = ResourceTex
o[$first] = ResourceTex
ResourceTex = copy ps-t[$first]
PoolSlots[$first:$last] = null
