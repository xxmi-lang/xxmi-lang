; DXGI_FORMAT_* and D3D11_BIND_* operands end at the first non-identifier character.
[CommandListClassify]
local $format = ResourceInput->Format
if $format == DXGI_FORMAT_BC7_UNORM_SRGB || ($format == DXGI_FORMAT_R16_FLOAT)
	$kind = 1
elif ($format == DXGI_FORMAT_R8G8B8A8_UNORM)
	$kind = 2
endif
$is_rt = ($bind & D3D11_BIND_RENDER_TARGET) != 0
