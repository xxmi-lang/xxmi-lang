; Hex (`0x`, hex floats) and lowercase `0b` binary literals, up to 64 digits
; (ParseFloatToken, ParseBinaryLiterals and ParseFloatValue in XXMI-Libs-Package
; DirectX11/CommandList.cpp and IniHandler.cpp).
[Constants]
global $mask = 0xFFFF
global locked $status = 0b1111111111111111111111111111111111111111111111111111111111111111
global $scale = 0X1.8p3

[CommandListLiterals]
local $low = $mask & 0xFF
local $bits = 0b1111 | $status
if $low == 0xF
	$bits = 0b1
else
	$bits = 0x2
endif
