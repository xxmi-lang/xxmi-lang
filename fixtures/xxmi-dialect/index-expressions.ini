; A pool index or range bound is any expression (ResourceCopyTarget::ParseTargetPool,
; ParseRangeBounds and FindResourceCopyTargetTokenEnd in XXMI-Libs-Package DirectX11/CommandList.cpp).
[PoolLods]
pool_size = 4

[Present]
run = CommandListIndexes

[CommandListIndexes]
local $a = 1
local $b = 2
local $lod = 0
cs-t1 = ref PoolLods[$a * $b + $lod]
cs-t2 = ref PoolLods[ $a : ($b + 1) ]
cs-t3 = ref PoolLods[-$a]
cs-t4 = ref PoolLods[max($a, 1)]
$PoolLods[$a + 0] = $b
