; Forms the DLL does not read as numbers: uppercase `0B`, a binary digit above 1,
; a non-hex digit after `0x`, and a 65th binary digit. One section each, so each is reported on its own.
[Constants]
global $upper = 0B11

[Constants]
global $digit = 0b2

[Constants]
global $hex = 0xG

[Constants]
global $long = 0b11111111111111111111111111111111111111111111111111111111111111111
