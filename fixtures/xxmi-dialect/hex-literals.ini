; Hex literals: `0x`/`0X` integers and hex floats (ParseFloatToken and ParseFloatValue in
; XXMI-Libs-Package DirectX11/CommandList.cpp and IniHandler.cpp).
[Constants]
global $mask = 0xFFFF
global $scale = 0X1.8p3

[Present]
run = CommandListHex

[CommandListHex]
local $low = $mask & 0xFF
local $half = $scale / 2
if $low == 0xF
	$low = 0x2 + $half
endif
