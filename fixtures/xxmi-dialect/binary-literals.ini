; Lowercase `0b` binary literals, up to 64 digits (ParseBinaryLiterals in
; XXMI-Libs-Package DirectX11/CommandList.cpp).
[Constants]
global locked $status = 0b1111111111111111111111111111111111111111111111111111111111111111

[Present]
run = CommandListBinary

[CommandListBinary]
local $bits = 0b1111 | $status
if $bits == 0b1
	$bits = 0b10
endif
