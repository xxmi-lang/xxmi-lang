[ResourceA]

[ResourceB]

[Present]
run = CommandListMain

[CommandListMain]
local $hash
run = snapshotoriginaltextures
run = restoreoriginaltextures
pre run = snapshotoriginaltextures
post run = RestoreOriginalTextures
RUN = SnapshotOriginalTextures
ps->MatchTextures(ResourceA) = ResourceB
ps->MatchTextures(ResourceA) = copy ResourceB
ps->MatchTextures(ResourceA) = ref ResourceB
ps->MatchTextures(ResourceA) = unless_null ResourceB
ps->MatchTextures(ResourceA) = null
ps->MatchTextures(ResourceA) = ps-t0
PS->matchtextures(ResourceA) = ResourceB
$hash = ResourceA->HashRegion(0x0123456789abcdef, 16)
$hash = ResourceA->HashRegion(0X1F, 16)
