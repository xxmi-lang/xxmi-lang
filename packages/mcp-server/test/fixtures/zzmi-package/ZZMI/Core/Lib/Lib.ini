namespace = Demo

; Usage:
;	Resource\Demo\Diffuse = ref ResourceMyDiffuse
;	run = CommandList\Demo\SetThings

[Constants]
; Set to 1 to skip the glow pass.
global $skip_glow = 0

;; @desc Binds the demo textures.
;; @in   Resource\Demo\Diffuse   diffuse texture (required)
;; @in   Resource\Demo\Normal    (optional)
;; @since Demo 1.0
;; @example
;;   Resource\Demo\Diffuse = ref ResourceMyDiffuse
;;   run = CommandList\Demo\SetThings
[CommandListSetThings]
if $skip_glow == 0
	ps-t3 = ResourceDiffuse
endif

[ResourceDiffuse]
[ResourceNormal]
