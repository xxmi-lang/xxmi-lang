[package]
name = "xxmi-mcp"
description = "xxmi-mcp: hosted read-only MCP server for XXMI (Rust port of packages/mcp-server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xxmi-mcp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service"] }
mimalloc = "0.1"
regex = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io-util"] }
toml.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout"] }
ureq = { version = "3", features = ["json"] }
xxmi-core = { path = "../xxmi-core" }
xxmi-spec-extractor = { path = "../xxmi-spec-extractor" }

[dev-dependencies]
tempfile = "3"
